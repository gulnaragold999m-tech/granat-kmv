  <script>
  (function(){
    var bad=document.getElementById('bsBad'),good=document.getElementById('bsGood');
    if(!bad||!good)return;
    var DATA={
      cafe:{
        bad:'Клиент пишет в соцсети, чтобы заказать пиццу. Менеджер занят на кассе и отвечает через полчаса. Клиент уже поужинал у конкурента. Деньги ушли вместе с ним.',
        good:'Клиент открыл бота, за три секунды выбрал по меню и оплатил прямо в Telegram. Кухня уже готовит. Заказ принят без участия человека.'
      },
      beauty:{
        bad:'Клиент звонит посреди процедуры — вы сбрасываете. Вечером листаете блокнот, состыковываете окошки, путаетесь в записях.',
        good:'Бот сам показывает свободное время, записывает клиента в таблицу или CRM и за два часа до визита присылает напоминание.'
      },
      sales:{
        bad:'Заявки с сайта падают на почту. Вы заглядываете туда раз в день. Горячий клиент за это время остыл или ушёл к тем, кто ответил быстрее.',
        good:'Заявка мгновенно прилетает вам в рабочий Telegram. Вы звоните через две минуты, пока клиент ещё держит телефон в руке.'
      }
    };
    var tabs=[].slice.call(document.querySelectorAll('.bs-tab'));
    function show(key){
      var d=DATA[key];if(!d)return;
      bad.classList.add('fade');good.classList.add('fade');
      setTimeout(function(){
        bad.textContent=d.bad;good.textContent=d.good;
        bad.classList.remove('fade');good.classList.remove('fade');
      },180);
    }
    tabs.forEach(function(t){
      t.addEventListener('click',function(){
        tabs.forEach(function(x){x.classList.remove('is-on');x.setAttribute('aria-selected','false')});
        t.classList.add('is-on');t.setAttribute('aria-selected','true');
        show(t.getAttribute('data-bs'));
      });
    });
    bad.textContent=DATA.cafe.bad;good.textContent=DATA.cafe.good;

    var rO=document.getElementById('rOrders'),rM=document.getElementById('rMins'),rC=document.getElementById('rCheck');
    var vO=document.getElementById('vOrders'),vM=document.getElementById('vMins'),vC=document.getElementById('vCheck');
    var oH=document.getElementById('oHours'),oM=document.getElementById('oMoney'),oP=document.getElementById('oPayback');
    if(!rO)return;
    var PRICE=35000, LOSS=0.15;   // рабочий бот с интеграцией — уровень Business
    function nf(n){return Math.round(n).toLocaleString('ru-RU')}
    function calc(){
      var o=+rO.value,m=+rM.value,c=+rC.value;
      vO.textContent=o;vM.textContent=m;vC.textContent=nf(c);
      var hours=o*m*30/60, money=o*c*30*LOSS;
      oH.textContent=nf(hours)+' ч';
      oM.textContent=nf(money)+' ₽';
      if(money>=PRICE){oP.textContent='Разработка окупится уже в первый месяц работы.'}
      else{oP.textContent='При таких объёмах разработка окупится примерно за '+Math.ceil(PRICE/Math.max(money,1))+' мес.'}
    }
    [rO,rM,rC].forEach(function(r){r.addEventListener('input',calc)});
    calc();
  })();
  </script>
