  <script>
  /* Секретарь на сайте — разговор и расчёт.

     Правила, по которым он собран:

     1. ЦЕНЫ НЕ ЖИВУТ ЗДЕСЬ. Всё берётся из window.CENY, который собирает
        `npm run sekretar` из data/prices.ts. В этом файле нет ни одной
        суммы в рублях — иначе она разъедется с прайсом, как уже
        разъезжалась на живом сайте.

     2. ВОПРОСЫ ТЕ ЖЕ, ЧТО У БОТА ВКонтакте. Порядок и формулировки взяты
        из CATEGORY_BRIEFS бота: сначала то, от чего цена зависит сильнее
        всего. Человек должен получить одинаковый ответ и здесь, и в ВК.

     3. НЕ ВЫДУМЫВАТЬ. Услуги нет в прайсе — говорим прямо, а не
        придумываем цену. Список берётся из того же прайса.

     4. ТЕЛЕФОН ПРОСИМ ПОСЛЕДНИМ. Сначала человек получает цену, потом
        решает, оставлять ли контакт. Наоборот — теряем тех, кто зашёл
        просто узнать стоимость. */

  (function () {
    var C = window.CENY;
    if (!C) return;                       // цены не подставились — блок молчит
    var feed = document.getElementById('sekFeed');
    if (!feed) return;

    var knopki  = document.getElementById('sekKnopki');
    var putEl   = document.getElementById('sekPut');
    var summaEl = document.getElementById('sekSumma');
    var podpisEl= document.getElementById('sekPodpis');
    var forma   = document.getElementById('sekForma');
    var msgEl   = document.getElementById('sekMsg');
    var zanovoB = document.getElementById('sekZanovo');

    /* ── Счёт ──────────────────────────────────────────────────────── */

    /** Цена за штуку по тиражу: берём последний столбец, чей порог достигнут. */
    function poTirazhu(tabl, stroka, kolvo) {
      var ceny = tabl.stroki[stroka];
      if (!ceny) return null;
      var i = 0;
      for (var k = 0; k < tabl.porogi.length; k++) {
        if (kolvo >= tabl.porogi[k] && ceny[k] != null) i = k;
      }
      return ceny[i];
    }

    /** Коэффициент заливки словами: 1.3 -> «+30%». Клиенту процент
        понятнее множителя. */
    function z_procent(koef) {
      return '+' + Math.round((koef - 1) * 100) + '%';
    }

    function rub(n) {
      return Math.round(n).toLocaleString('ru-RU') + ' ₽';
    }

    /** Цена одного бига по числу бигов в заказе.
     *
     *  sPechatyu = true, когда биговка идёт вместе с печатью и печать
     *  уже в счёте: приёмки файла и отдельной приладки нет, поэтому
     *  на тираже дешевле. Запасные числа стоят на случай, если прайс
     *  не отдал таблицу, — молча считать по нулю нельзя. */
    function cenaBigovki(kolvo, sPechatyu) {
      var b = C.bigovka;
      if (!b) { return (C.otdelka && C.otdelka.bigovkaSgib) || 7; }
      var ceny = sPechatyu ? b.sPechatyu : b.otdelno;
      var cena = ceny[0];
      for (var k = 0; k < b.porogi.length; k++) {
        if (kolvo >= b.porogi[k] && ceny[k] != null) cena = ceny[k];
      }
      return cena;
    }

    /** Цена ламинации одного листа по формату и тиражу, плёнка 80–100 мкм.
     *
     *  Ламинация давно есть в прайсе отдельной услугой, но как ДОБАВКА
     *  к сертификату или открытке её никто не предлагал: человек должен
     *  был сам догадаться заказать её вторым заходом. Владелица попросила
     *  17.08.2026 спрашивать прямо в диалоге. */
    function cenaLaminacii(format, kolvo) {
      // Берём ту же таблицу, по которой считается ламинация отдельной
      // услугой, — не копию. Иначе добавка и услуга разъедутся в ценах.
      var t = C.laminaciya;
      if (!t) return null;
      var stroka = ({
        'А6': 'А6 и меньше, 80–100 мкм',
        'Евро': 'А6 и меньше, 80–100 мкм',
        'А5': 'А5, 80–100 мкм',
        'А4': 'А4, 80–100 мкм',
        'А3': 'А3, 80–100 мкм'
      })[format];
      if (!stroka) return null;
      return poTirazhu(t, stroka, kolvo);
    }

    /** Шаг «отделка»: ламинация и фольгирование одним вопросом.
     *
     *  Фольгирование появляется, ТОЛЬКО если в прайсе задана цена.
     *  Пока `folgirovanie.cena` равна null, спрашивать про него нельзя:
     *  назвать цену нечем, а «посчитаем позже» — это ровно та пауза,
     *  на которой ушёл клиент 16.08. Появится число в прайсе — появится
     *  и кнопка, править код не придётся. */
    function shagOtdelka(format) {
      return { id: 'otdelka', vopros: 'Добавим отделку?', varianty: function (v) {
        var f = v.format || format;
        var spisok = [{ t: 'Без отделки', v: 'net' }];
        var lam = cenaLaminacii(f, v.kolvo || 1);
        if (lam) {
          spisok.push({ t: 'Заламинировать', i: rub(lam) + ' за штуку, плёнка 80–100 мкм', v: 'laminaciya' });
        }
        var folga = C.folgirovanie && C.folgirovanie.cena;
        if (folga) {
          spisok.push({ t: 'Тиснение фольгой', i: rub(folga) + ' за лист, ' + C.folgirovanie.opisanie, v: 'folga' });
        }
        if (lam && folga) {
          spisok.push({ t: 'И то, и другое', v: 'oba' });
        }
        return spisok;
      } };
    }

    /** Отделка в счёт: возвращает прибавку к цене ЗА ШТУКУ и строчки. */
    function schetOtdelki(o, stroki) {
      var pribavka = 0;
      if (!o.otdelka || o.otdelka === 'net') return 0;
      var lam = cenaLaminacii(o.format, o.kolvo || 1);
      var folga = C.folgirovanie && C.folgirovanie.cena;
      if ((o.otdelka === 'laminaciya' || o.otdelka === 'oba') && lam) {
        pribavka += lam;
        stroki.push('Ламинация 80–100 мкм — ' + rub(lam) + ' за штуку');
      }
      if ((o.otdelka === 'folga' || o.otdelka === 'oba') && folga) {
        pribavka += folga;
        stroki.push('Тиснение фольгой — ' + rub(folga) + ' за штуку');
      }
      return pribavka;
    }

    /* ── Сценарии ──────────────────────────────────────────────────── */

    var TIRAZH_MALYJ = [
      { t: '1 штука', v: 1 }, { t: '2–9', v: 5 }, { t: '10', v: 10 },
      { t: '30', v: 30 }, { t: '50', v: 50 }, { t: '100 и больше', v: 100 }
    ];

    /* Макет. Один и тот же вопрос для всей полиграфии, поэтому вынесен.

       Правило владелицы, 17.08.2026: «Есть мода на сегодня: люди учатся
       генерить открытки — это хорошо, но печать останется за нами.
       Если ничего не надо править, то заказ принимается в работу».

       Отсюда два следствия. Первое: готовый файл не тянет за собой
       ни доплаты, ни лишнего шага — проверили и печатаем. Второе:
       картинку из нейросети не отбраковываем и не высмеиваем, а честно
       говорим, что в ней ломается при печати, и не берём денег, пока
       правка не понадобилась и не согласована. */
    var MAKET = [
      { t: 'Файл готов', i: 'править ничего не надо — печатаем', v: 'gotov' },
      { t: 'Сделал сам, в нейросети', i: 'проверим, годится ли в печать', v: 'nejroset' },
      { t: 'Макета нет', i: 'нарисуем по вашей задаче', v: 'net' }
    ];

    var SROK = [
      { t: 'Не срочно', i: 'стандартно 3–5 рабочих дней', v: 'obychno' },
      { t: 'Сегодня, день в день', i: 'плюс 30% к заказу', v: 'srochno' }
    ];

    var SCENARII = {
      sertifikat: {
        imya: 'Сертификаты, дипломы, грамоты',
        privet: 'Сертификаты — наша частая работа. Уточню несколько вещей и назову цену.',
        shagi: [
          // Формат спрашиваем первым: А4 и А5 стоят по-разному, а раньше
          // секретарь считал любой сертификат как А4 и на А5 завышал цену
          // вдвое. Замечено владелицей 17.08.2026.
          { id: 'format', vopros: 'Какой формат?', varianty: [
            { t: 'А4', i: '210×297 мм, обычный размер грамоты', v: 'А4' },
            { t: 'А5', i: '148×210 мм, вполовину меньше', v: 'А5' }
          ] },
          // Стороны — второй вопрос, потому что он закрывает носитель:
          // у фотобумаги обратная сторона без покрытия.
          { id: 'storony', vopros: 'Печать с одной стороны или с двух?', varianty: [
            { t: 'С одной', i: 'текст только на лицевой', v: 'odna' },
            { t: 'С двух', i: 'на обороте тоже печать', v: 'dve' }
          ] },
          { id: 'kolvo', vopros: 'Сколько экземпляров нужно?', varianty: TIRAZH_MALYJ },
          // ПОЧЕМУ НЕ «КАРТОН». До 17.08.2026 этот носитель назывался
          // «картон 250–260 г/м²». Жёсткий мелованный картон не берёт
          // ни одна наша машина: у лазерного Canon MF750C предел
          // 176–200 г/м², а у струйного Epson чернила на мелованной
          // поверхности не сохнут. Печатаем на плотной матовой бумаге —
          // она гибкая, проходит и держит краску. Разбор —
          // docs/bumaga-i-printery.md.
          { id: 'material', vopros: 'На чём печатаем?', varianty: function (v) {
            var spisok = [];
            // Фотобумага односторонняя: на обороте нет покрытия, краска
            // размазывается. Поэтому при двусторонней печати её в списке
            // просто нет — вместо отказа после выбора.
            //
            // ЭТО ПРАВИЛО ВРЕМЕННОЕ. Существует матовая ДВУСТОРОННЯЯ
            // фотобумага (Double Sided) 220–250 г/м²: на ней печатают
            // с двух сторон и по обороту пишут ручкой. Владелица решила
            // 17.08.2026 перейти на неё. Как только пачка куплена
            // и проверена — снять условие ниже и убрать эту оговорку.
            // Пока на полке односторонняя, условие защищает клиента
            // от испорченного заказа. Разбор — docs/bumaga-i-printery.md.
            if (v.storony !== 'dve') {
              spisok.push({ t: 'Матовая фотобумага 230 г/м²', i: 'плотная, как фотография', v: 'foto' });
            }
            spisok.push({ t: 'Плотная матовая бумага 250–260 г/м²', i: 'солиднее, печать с двух сторон уже в цене', v: 'karton' });
            spisok.push({ t: 'Не знаю, посоветуйте', v: 'sovet' });
            return spisok;
          } },
          shagOtdelka('А4'),
          { id: 'maket', vopros: 'Макет уже есть?', varianty: MAKET },
          { id: 'srok', vopros: 'К какому сроку?', varianty: SROK }
        ],
        sovet: {
          material: function (v) {
            if (v.storony === 'dve') {
              return 'Для двусторонней печати остаётся плотная матовая бумага 250–260 г/м²: у обычной фотобумаги обратная сторона без покрытия, краска на ней размазывается. Печать с двух сторон в цену уже включена, доплаты за это нет.';
            }
            return 'Если сертификат вручают и вешают на стену — берите плотную матовую бумагу 250–260 г/м², она держит форму и выглядит солидно. Если кладут в файл или отправляют почтой — хватит матовой фотобумаги 230 г/м², она дешевле. Плотнее 260 г/м² наш принтер не берёт — такую бумагу мы честно не предлагаем.';
          }
        },
        schet: function (o) {
          var kolvo = o.kolvo, stroki = [], zametki = [], zaShtuku;
          var format = o.format || 'А4';
          var dve = o.storony === 'dve';

          if (o.material === 'karton') {
            // Штучная цена заведена только на А4: у листа картона нет
            // «половинки», приладка та же. А5 идёт по таблице открыток.
            zaShtuku = (format === 'А4' && kolvo < 10)
              ? C.shtuchnayaA4
              : poTirazhu(C.otkrytki, format, kolvo);
            stroki.push('Плотная матовая бумага 250–260 г/м², ' + format + ', полноцвет' +
                        (dve ? ' с двух сторон' : '') + ' — ' + rub(zaShtuku) + ' за штуку');
            // Цены раздела открыток посчитаны за 4+4. Двусторонняя печать
            // на картоне денег не добавляет, и это надо сказать вслух:
            // иначе человек ждёт наценку и не верит расчёту.
            if (dve) { zametki.push('Печать с двух сторон входит в цену картона — отдельной наценки нет.'); }
          } else {
            // Таблица печати фотографий пишет форматы латиницей.
            zaShtuku = poTirazhu(C.foto, format === 'А5' ? 'A5' : 'A4', kolvo) *
                       C.koefficienty.fotobumagaPlotnaya;
            stroki.push('Матовая фотобумага 230 г/м², ' + format + ' — ' + rub(zaShtuku) + ' за штуку');
          }

          // МИНИМУМА ЗДЕСЬ НЕТ, и это решение владелицы от 17.08.2026.
          //
          // До этого дня сертификат на картоне подтягивался к минимуму
          // раздела открыток: одна штука — 1 200 ₽ при цене печати 200 ₽.
          // 16 августа позвонил первый живой клиент с Карт и просил ровно
          // одну штуку. Выбери он картон — услышал бы 1 200 ₽ и ушёл бы
          // ещё быстрее, чем ушёл на самом деле.
          //
          // Сертификаты, дипломы и грамоты — розничная позиция со своей
          // ценой за штуку, как в прайсе: грамота от одной штуки. Минимум
          // раздела открыток к ним не применяется. У самих открыток
          // и приглашений он остаётся: там тираж — норма, а штука — нет.
          // Единственный порог — розничный минимум в 150 ₽: столько стоит
          // грамота от одной штуки по прайсу. Он не про тираж, а про то,
          // что дешевле этого печатать нечего.
          zaShtuku += schetOtdelki(o, stroki);
          var summa = zaShtuku * kolvo;
          var roznica = (C.minimalki && C.minimalki.sertifikat) || 0;
          if (summa < roznica) {
            summa = roznica;
            zametki.push('Розничная цена от ' + rub(roznica) + ' — по ней печатаем ' +
                         'сертификаты, дипломы и грамоты от одной штуки.');
          } else if (kolvo === 1) {
            zametki.push('Одну штуку печатаем — минимального тиража ' +
                         'на сертификаты, дипломы и грамоты у нас нет.');
          }
          return { summa: summa, stroki: stroki, zametki: zametki };
        }
      },

      otkrytki: {
        imya: 'Открытки и приглашения',
        privet: 'Печатаем на плотной бумаге до 260 г/м², полноцвет с двух сторон.',
        shagi: [
          { id: 'vid', vopros: 'Открытки или приглашения?', varianty: [
            { t: 'Открытки', i: 'поздравительные, от себя', v: 'otkrytki' },
            { t: 'Приглашения', i: 'событие с датой и местом', v: 'priglasheniya' }
          ] },
          { id: 'format', vopros: 'Какой формат?', varianty: [
            { t: 'А6', i: '105×148 мм', v: 'А6' },
            { t: 'Евро', i: '210×97 мм', v: 'Евро' },
            { t: 'А5', i: '148×210 мм', v: 'А5' },
            { t: 'А4', i: '210×297 мм', v: 'А4' }
          ] },
          // Штучные заказы бывают, и часто срочные: «бывает срочно
          // и только одна открытка нужна». Раньше тираж начинался
          // с десяти, и такому клиенту секретарь ответить не мог.
          { id: 'kolvo', vopros: 'Какой тираж?', varianty: [
            { t: '1 штука', v: 1 }, { t: '2–9', v: 5 },
            { t: '10–20', v: 15 }, { t: '50', v: 50 },
            { t: '100', v: 100 }, { t: '200 и больше', v: 200 }
          ] },
          // Разворот и биговка — отдельные деньги, а печать с двух
          // сторон уже входит в цену. Клиенту это неочевидно, поэтому
          // спрашиваем прямо и пишем в подсказке, что уже включено.
          // Материал спрашиваем ВСЕГДА. Правило владелицы 17.08.2026:
          // «Там хоть открытка, хоть сертификат, хоть фотография —
          // всегда надо спрашивать». До этого дня открытки печатались
          // по одной жёстко зашитой бумаге, и ни скидка за более тонкую,
          // ни наценка за дизайнерскую в счёт не попадали.
          //
          // Коэффициенты — из раздела «Материал и отделка» прайса:
          // плотная 200–230 дешевле на 10%, матовая 250–260 базовая,
          // фактурная дизайнерская дороже на 20–40% (берём нижнюю
          // границу, точную назовём после выбора бумаги).
          { id: 'material', vopros: 'На какой бумаге печатаем?', varianty: function (v) {
            var tabl = v.vid === 'priglasheniya' ? C.priglasheniya : C.otkrytki;
            var baza = (v.format === 'А4' && v.kolvo < 10)
              ? C.shtuchnayaA4
              : poTirazhu(tabl, v.format, v.kolvo);
            return [
              { t: 'Плотная 200–230 г/м²', i: rub(baza * 0.9) + ' за штуку, тоньше и дешевле', v: 0.9 },
              { t: 'Плотная матовая 250–260 г/м²', i: rub(baza) + ' за штуку, наш обычный выбор', v: 1 },
              { t: 'Фактурная дизайнерская', i: 'от ' + rub(baza * 1.2) + ' за штуку, лён, вельвет', v: 1.2 }
            ];
          } },
          { id: 'sgib', vopros: 'Складывается пополам?', varianty: [
            { t: 'Нет, плоская', i: 'печать с двух сторон уже в цене', v: 'net' },
            { t: 'Да, с разворотом', i: 'биговка и сгиб', v: 'da' }
          ] },
          shagOtdelka('А6'),
          { id: 'maket', vopros: 'Макет уже есть?', varianty: MAKET },
          { id: 'srok', vopros: 'К какому сроку?', varianty: SROK }
        ],
        schet: function (o) {
          var tabl = o.vid === 'priglasheniya' ? C.priglasheniya : C.otkrytki;
          var zametki = [], zaShtuku;

          // А4 штучно считается как сертификат: у листа картона нет
          // «половинки», поэтому цена своя и минимальный заказ выше.
          if (o.format === 'А4' && o.kolvo < 10) {
            zaShtuku = C.shtuchnayaA4;
          } else {
            zaShtuku = poTirazhu(tabl, o.format, o.kolvo);
          }

          var koef = Number(o.material) || 1;
          zaShtuku = zaShtuku * koef;
          var nazvanieBumagi = koef === 0.9 ? 'плотная бумага 200–230 г/м²'
                             : koef === 1.2 ? 'фактурная дизайнерская бумага'
                             : 'плотная матовая бумага 250–260 г/м²';
          var stroki = [o.format + ', ' + nazvanieBumagi + ', полноцвет с двух сторон — ' +
                        rub(zaShtuku) + ' за штуку'];
          if (koef === 1.2) {

        ? shag.varianty(vybor)
        : shag.varianty;

      skazat('bot', typeof shag.vopros === 'function' ? shag.vopros(vybor) : shag.vopros);

      function otvet(v) {
        // «Не знаю, посоветуйте» — объясняем и спрашиваем снова,
        // уже без этой кнопки, чтобы не ходить по кругу.
        if (v.v === 'sovet') {
          skazat('ya', v.t);
          skazat('bot', typeof scen.sovet[shag.id] === 'function'
            ? scen.sovet[shag.id](vybor) : scen.sovet[shag.id]);
          pokazatKnopki(
            spisok.filter(function (x) { return x.v !== 'sovet'; }),
            otvet
          );
          return;
        }
        vybor[shag.id] = v.v;
        // В заявку — с подписью шага. В чеке на экране подпись не нужна:
        // там человек только что сам нажимал эти кнопки и всё помнит.
        put.push((PODPISI[shag.id] ? PODPISI[shag.id] + ': ' : '') + v.t);
        obnovitChek();
        skazat('ya', v.t);
        shagIndex++;
        sleduyushchijShag();
      }

      pokazatKnopki(spisok, otvet);
    }

    /** Счёт по текущим ответам. Вынесен отдельно, потому что считать
        приходится не один раз: секретарь пересчитывает заказ прямо
        в разговоре, когда клиенту дорого или нужно быстрее. */
    function poschitat() {
      var r = scen.schet(vybor);

      // Разбор итога по строчкам. Заведён 17.08.2026: на экране крупно
      // стояло «293 ₽», а под ним «225 ₽ за штуку», и это читалось как
      // противоречие — цифры разные, откуда взялась разница, не сказано.
      // Теперь наценка и скидка показаны рублями, а не только процентом.
      r.razbor = [];

      if (r.summa != null) {
        // Работа с макетом ложится в базу ДО срочности: срочный дизайн
        // такой же срочный, как срочная печать.
        var m = C.maket || {};
        if (vybor.maket === 'net' && m.sNulyaOt) {
          r.summa = r.summa + m.sNulyaOt;
          r.stroki.push('Дизайн с нуля — от ' + rub(m.sNulyaOt));
          r.zametki.push('В расчёте нижняя граница: точную сумму за дизайн назовём, ' +
                         'когда поймём задачу, — и до работы, а не после.');
        } else if (vybor.maket === 'nejroset') {
          r.zametki.push('Картинку из нейросети берём в печать — доплаты за это нет. ' +
                         'Проверим два места, где такие файлы обычно ломаются: разрешение ' +
                         '(для печати нужно 300 точек на дюйм, экранная картинка обычно 72) ' +
                         'и пропорции — нейросеть любит квадрат, а лист А4 вытянутый. ' +
                         'Если понадобится подогнать — адаптация ' + m.adaptaciyaOt +
                         '–' + rub(m.adaptaciyaDo) + ', и мы скажем об этом до печати, ' +
                         'а не поставим в счёт молча.');
        } else if (vybor.maket === 'gotov') {
          /* Про ОБЕ СТОРОНЫ говорим прямо здесь, в диалоге, а не только
             подписью под полем файла. 18.08.2026 клиентка приложила лицо
             листовки, увидела, что файл прикрепился, и была уверена, что
             отправила всё. Печатать было нечего, и выяснилось это через
             сутки — уже после того, как цену обсудили и согласовали. */
          r.zametki.push('Файл готовый — проверяем размер и разрешение и запускаем в печать. ' +
                         'Доплаты за макет нет. Печать двусторонняя, поэтому приложите ' +
                         'ОБЕ стороны: в поле ниже можно выбрать несколько файлов сразу, ' +
                         'а если их много — одним архивом ZIP.');
        }

        var baza = r.summa;

        // Срочность множит ВЕСЬ заказ, включая биговку и другую работу
        // после печати: она уже сидит в summa к этому месту. Считать
        // её от одной печати нельзя — срочной становится вся смена.
        if (vybor.srok === 'srochno') {
          var doplata = baza * (C.koefficienty.srochno - 1);
          r.summa = baza + doplata;
          r.razbor.push({ t: 'Стоимость заказа', v: baza });
          r.razbor.push({
            t: 'Срочность: сегодня, день в день — +' +
               Math.round((C.koefficienty.srochno - 1) * 100) + '%',
            v: doplata
          });
        }

        // Акция применяется последней, к итогу: клиент видит ту же скидку,
        // что была обещана в объявлении. Акции заводятся в data/prices.ts —
        // объявили в рекламе, значит секретарь о ней знает.
        var akciya = dejstvuyushchayaAkciya();
        if (akciya && akciya.procent > 0) {
          if (!r.razbor.length) { r.razbor.push({ t: 'Стоимость заказа', v: r.summa }); }
          var skidka = r.summa * akciya.procent / 100;
          r.summa = r.summa - skidka;
          r.razbor.push({ t: 'Акция «' + akciya.nazvanie + '» — −' + akciya.procent + '%', v: -skidka });
          r.zametki.push('Акция «' + akciya.nazvanie + '»: ' + akciya.uslovie +
                         '. Действует ' + akciya.do_ + '.');
        }

        // Разбор из одной строчки не нужен: он повторил бы итог.
        if (r.razbor.length) { r.razbor.push({ t: 'Итого', v: r.summa, itogo: true }); }
        else { r.razbor = []; }
      }
      return r;
    }

    /** Акция для текущей услуги, если она сейчас идёт. */
    function dejstvuyushchayaAkciya() {
      var spisok = C.akcii || [];
      var kod = null;
      for (var k in SCENARII) { if (SCENARII[k] === scen) kod = k; }
      for (var i = 0; i < spisok.length; i++) {
        var a = spisok[i];
        if (!a.gde || !a.gde.length || a.gde.indexOf(kod) !== -1) return a;
      }
      return null;
    }

    function finish() {
      knopki.innerHTML = '';
      itog = poschitat();

      if (itog.summa != null) {
        var text = '<span class="sek-cifra">' + rub(itog.summa) + '</span>';
        itog.stroki.forEach(function (s) { text += s + '<br>'; });
        if (itog.razbor && itog.razbor.length) {
          text += '<span class="sek-razbor">';
          itog.razbor.forEach(function (r, i) {
            // Плюс ставим только у надбавок. У первой строки (это база)
            // и у итога знака нет — иначе читается как «прибавить к чему-то».
            var znak = r.v < 0 ? '−' : (i === 0 || r.itogo ? '' : '+');
            text += '<span' + (r.itogo ? ' class="itogo"' : '') + '><i>' + r.t + '</i>' +
                    '<b>' + znak + rub(Math.abs(r.v)) + '</b></span>';
          });
          text += '</span>';
        }
        skazat('bot', text);
        summaEl.textContent = rub(itog.summa);
        podpisEl.textContent = 'по прайсу студии';
      } else {
        skazat('bot', 'Такую задачу считаем вручную — она того стоит.');
        summaEl.textContent = 'считаем';
        podpisEl.textContent = 'ответим в рабочие часы';
      }

      if (itog.zametki.length) skazat('bot', itog.zametki.join('<br>'));
      soglasieSCenoj();
    }

    /* ПРОЦЕНТ ПРЕДОПЛАТЫ СЧИТАЕТСЯ В ОДНОМ МЕСТЕ. Это не красота, а разбор
       живой ошибки 18.08.2026: секретарь называл процент в трёх местах —
       в вопросе «оформляем?», в заявке владелице и на экране оплаты.
       Правило про 50% от 200 штук завели в первых двух, а третье
       осталось на 30%. Владелица увидела это на своём же заказе:
       «в переписке секретарь говорит 50%, а на выходе 30%».

       Одна цифра, названная в трёх местах, рано или поздно разъедется
       в двух. Поэтому места вычисления теперь одно, а не три. */
    function bolshojTirazh() {
      var o = C.oplata || {};
      var kolvo = Number(vybor && vybor.kolvo) || 0;
      return !!(o.bolshojOt && kolvo >= o.bolshojOt && o.procentBolshoj);
    }

    function procentPredoplaty() {
      var o = C.oplata || {};
      /* На большом тираже материалы закупаются ДО печати, и 30% их
         не покрывают: на 500 листах А4 с плотной заливкой одних чернил
         и бумаги на 22 700 ₽ при предоплате 10 710 ₽. Оборотных денег
         у студии нет, и начать такой тираж физически нельзя. */
      return bolshojTirazh() ? o.procentBolshoj : (o.procent || 30);
    }

    /* Подтверждение цены — отдельный шаг, и он обязателен.
       Требование владелицы, 16.08.2026: «вышла цена, например 290 рублей.
       Если устраивает цена — тогда формировать заявку. Мне просто так
       не надо: я распечатала, а мне говорят — я передумала».
       Телефон просим только после «да»: заявка без согласия с ценой —
       это не заказ, а работа на удачу. */
    function soglasieSCenoj() {
      if (itog.summa == null) {          // «другая задача» — считаем вручную
        skazat('bot', 'Оставьте телефон — перезвоним и посчитаем вместе.');
        forma.hidden = false;
        document.getElementById('sekTel').focus();
        return;
      }

      // Процент предоплаты берётся из прайса, а не пишется здесь числом.
      // 17.08.2026 тут стояло «50%», когда в прайсе решили 30: строка,
      // вписанная руками, пережила правку прайса и обещала клиенту чужую
      // цифру. Теперь источник один — OPLATA.predoplataProcent.
      var o = C.oplata || {};
      var proc = procentPredoplaty();
      var bolshoj = bolshojTirazh();

      var pro = 'Печать запускаем после предоплаты ' + proc + '%.';
      if (bolshoj) pro += '<br>На тираже от ' + o.bolshojOt +
        ' штук предоплата половина: бумагу и чернила на такой объём закупаем до печати.';
      skazat('bot', '<b>Оформляем по этой цене?</b><br>' + pro);

      // Ровно два ответа. Требование владелицы: «зачем пустая переписка,
      // она для себя всё узнала — или да, или нет». Уговоров нет: человек,
      // которому дорого, и так это понял, а лишние вопросы отнимают время
      // у обоих.
      pokazatKnopki([
        { t: 'Да, оформляем', v: 'da' },
        { t: 'Нет', v: 'net' }
      ], function (v) {
        skazat('ya', v.t);

        if (v.v === 'net') { return pochemuNet(); }

        // Согласие с ценой уезжает в заявку: по нему видно, что человек
        // цену видел и принял, — и разговора «я передумала» после печати
        // уже не будет.
        put.push('Цену подтвердил: ' + rub(itog.summa));
        obnovitChek();
        podpisEl.textContent = 'цена подтверждена';
        soglasovanieTZ();
      });
    }

    /* ТЕХНИЧЕСКОЕ ЗАДАНИЕ И ПОДПИСЬ «СОГЛАСОВАНО».
       Требование владелицы 18.08.2026: «секретарь после всех вопросов
       предлагает: прочитайте внимательно техническое задание
       и поставьте подпись согласовано».

       Смысл ровно один и он денежный. Заказ печатается по параметрам,
       которые человек назвал кнопками, а помнит он их плохо: выбрал
       А5, а ждал А4; согласился на 130 г/м², а думал про плотную.
       Тираж уже нарезан, имя и дата на изделии чужие, перепродать
       некому. Поэтому перед телефоном человек видит ВЕСЬ заказ одним
       списком и подтверждает его отдельным нажатием.

       Это не подпись в юридическом смысле, и обещать клиенту обратное
       нельзя. Но в заявке остаётся строка с датой и временем — видно,
       что задание показывали и человек его принял. */
    function soglasovanieTZ() {
      var stroki = put.slice();
      var text = '<b>Техническое задание. Прочитайте внимательно.</b><br><br>' +
                 stroki.map(function (s) { return '• ' + s; }).join('<br>');
      if (itog && itog.zametki && itog.zametki.length) {
        text += '<br><br>' + itog.zametki.join('<br>');
      }
      text += '<br><br>Печатаем ровно так. Что-то не так — нажмите «Нужно поправить», ' +
              'и пересчитаем: тираж уже нарезанный переделать нельзя.';
      skazat('bot', text);

      pokazatKnopki([
        { t: 'Согласовано', v: 'da' },
        { t: 'Нужно поправить', v: 'net' }
      ], function (s) {
        skazat('ya', s.t);

        if (s.v === 'net') {
          skazat('bot', 'Хорошо, посчитаем заново — выберите то, что нужно.');
          start();
          return;
        }

        var d = new Date();
        var dvuznak = function (n) { return (n < 10 ? '0' : '') + n; };
        put.push('ТЗ согласовано клиентом: ' +
                 dvuznak(d.getDate()) + '.' + dvuznak(d.getMonth() + 1) + '.' +
                 d.getFullYear() + ', ' + dvuznak(d.getHours()) + ':' + dvuznak(d.getMinutes()));
        obnovitChek();
        podpisEl.textContent = 'задание согласовано';
        skazat('bot', 'Принято. Оставьте телефон — передам заявку в студию, и мы подтвердим срок. Макет проверяем до печати.');
        forma.hidden = false;
        document.getElementById('sekTel').focus();
      });
    }

    /* Отказ — не конец разговора. Требование владелицы, 16.08.2026:
       «не надо меня звать, сам секретарь доведёт диалог, спросит».
       Поэтому он не передаёт человека менеджеру, а пересчитывает заказ
       прямо здесь: убирает срочность, меняет бумагу, считает больший
       тираж — и снова называет цену. Звонок остаётся крайним вариантом,
       когда удешевлять больше нечем. */
    function pochemuNet() {
      skazat('bot', 'Понял. Что именно не подошло?');
      pokazatKnopki([
        { t: 'Дорого', v: 'dorogo' },
        { t: 'Нужно быстрее', v: 'srok' },
        { t: 'Просто смотрю', v: 'smotryu' }
      ], function (p) {
        skazat('ya', p.t);

        if (p.v === 'smotryu') {
          skazat('bot', 'Хорошо, никаких обязательств. Цена по прайсу и не изменится — будет нужно, возвращайтесь.<br>+7 (999) 244-99-99, Пн–Сб 09:00–20:00, Вс 10:00–19:00.');
          knopki.innerHTML = '';
          podpisEl.textContent = 'заказ не оформлен';
          return;
        }

        if (p.v === 'srok') {
          if (vybor.srok !== 'srochno' && scen.shagi.some(function (s) { return s.id === 'srok'; })) {
            vybor.srok = 'srochno';
            put.push('Изменили: срочно, день в день');
            pereschitat('Тогда делаем день в день. Успеваем, если техника свободна — подтвердим при приёме заказа.');
          } else {
            skazat('bot', 'Быстрее уже не выйдет — это наш самый короткий срок, печать в день обращения.');
            soglasieSCenoj();
          }
          return;
        }

        // Дорого — собираем то, чем реально можно удешевить ЭТОТ заказ.
        // К каждому варианту сразу считаем итог и показываем его в подписи:
        // человек должен видеть выгоду ДО нажатия, а не после. Скидок мы
        // не выдумываем — дешевле выходит по тиражным ценам прайса.
        var varianty = [];
        if (vybor.srok === 'srochno') {
          varianty.push({
            t: 'Убрать срочность',
            i: 'станет ' + rub(probnyj({ srok: 'obychno' }).summa) + ', срок 3–5 дней',
            v: 'ne_srochno'
          });
        }
        if (vybor.material === 'karton') {
          varianty.push({
            t: 'Фотобумага вместо картона',
            i: 'станет ' + rub(probnyj({ material: 'foto' }).summa) + ', 230 г/м²',
            v: 'foto'
          });
        }
        var bolshe = sleduyushchijTirazh();
        if (bolshe) {
          var probaT = probnyj({ kolvo: bolshe });
          varianty.push({
            t: 'Посчитать ' + bolshe + ' шт.',
            i: rub(probaT.summa / bolshe) + ' за штуку вместо ' +
               rub(itog.summa / vybor.kolvo) + ' — по тиражной цене прайса',
            v: 'tirazh'
          });
        }

        if (!varianty.length) {
          skazat('bot', 'Дешевле уже не сделать — это минимальная цена по прайсу для такого заказа.');
          soglasieSCenoj();
          return;
        }

        skazat('bot', 'Смотрите, что можно изменить:');
        varianty.push({ t: 'Оставить как есть', v: 'kak_est' });

        pokazatKnopki(varianty, function (v2) {
          skazat('ya', v2.t);
          if (v2.v === 'kak_est') return soglasieSCenoj();

          if (v2.v === 'ne_srochno') {
            vybor.srok = 'obychno';
            put.push('Изменили: без срочности, 3–5 дней');
            return pereschitat('Убрал срочность — срок 3–5 рабочих дней.');
          }
          if (v2.v === 'foto') {
            vybor.material = 'foto';
            put.push('Изменили: фотобумага 230 г/м²');
            return pereschitat('Переставил на матовую фотобумагу 230 г/м².');
          }
          vybor.kolvo = bolshe;
          put.push('Изменили: тираж ' + bolshe + ' шт.');
          pereschitat('Посчитал на ' + bolshe + ' штук.');
        });
      });
    }

    /** Пробный счёт «а что если»: считаем с изменёнными ответами, но
        сами ответы не трогаем. Нужен, чтобы показать цену варианта
        в подписи кнопки до того, как клиент её нажал. */
    function probnyj(izmeneniya) {
      var bylo = vybor;
      var kopiya = {};
      for (var k in bylo) { if (bylo.hasOwnProperty(k)) kopiya[k] = bylo[k]; }
      for (var i in izmeneniya) { if (izmeneniya.hasOwnProperty(i)) kopiya[i] = izmeneniya[i]; }
      vybor = kopiya;
      var r = poschitat();
      vybor = bylo;
      return r;
    }

    /** Следующая ступень тиража из того же шага сценария — чтобы
        предложение «взять больше» шло от прайса, а не от фантазии. */
    function sleduyushchijTirazh() {
      var shag = scen.shagi.filter(function (s) { return s.id === 'kolvo'; })[0];
      if (!shag || !vybor.kolvo) return null;
      var bolshie = shag.varianty
        .map(function (v) { return v.v; })
        .filter(function (n) { return typeof n === 'number' && n > vybor.kolvo; });
      return bolshie.length ? bolshie[0] : null;
    }

    /** Пересчёт после изменения параметров: новая цена и снова вопрос. */
    function pereschitat(chto) {
      obnovitChek();
      itog = poschitat();
      var text = chto + '<span class="sek-cifra">' + rub(itog.summa) + '</span>';
      itog.stroki.forEach(function (s) { text += s + '<br>'; });
      skazat('bot', text);
      summaEl.textContent = rub(itog.summa);
      soglasieSCenoj();
    }

    /* ── Отправка заявки ───────────────────────────────────────────── */

    /* ── Замер заливки по самому макету ────────────────────────────

       Указание владелицы 18.08.2026: «научи его определять количество
       краски». До этого категорию заполнения называл клиент кнопкой,
       а он её на глаз не знает — и занижает, потому что дешевле.

       КАК СЧИТАЕМ. Браузер рисует картинку на холсте 240 точек шириной
       и смотрит каждую точку: насколько она темнее белого. Белый лист —
       ноль краски, чёрная плашка — единица. Среднее по всем точкам и есть
       доля краски.

       Это оценка «на глаз машины», а не типографский расчёт покрытия:
       жёлтая заливка тратит одну краску, но выглядит светлой. Поэтому
       результат — повод пересчитать и проверить файлом, а не приговор.

       ЧЕГО НЕ УМЕЕМ. PDF, CDR, AI, EPS браузер не откроет — там честно
       говорим, что посмотрим руками. Границы 20% и 60% взяты из прайса,
       ZAPOLNENIE_MAKETA. */
    var zamerMaketa = null;

    function zamerZalivki(fajl, gotovo) {
      if (!/^image\/(jpeg|png|webp)$/.test(fajl.type)) { gotovo(null); return; }
      var url = URL.createObjectURL(fajl);
      var img = new Image();
      img.onload = function () {
        try {
          var w = 240, h = Math.max(1, Math.round(img.height * w / img.width));
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          var ctx = c.getContext('2d');
          /* Белая подложка: у PNG с прозрачностью пустота иначе считается
             чёрной, и белый макет с прозрачным фоном показал бы 100% краски. */
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          var d = ctx.getImageData(0, 0, w, h).data, sum = 0, n = 0;
          for (var i = 0; i < d.length; i += 4) {
            sum += 1 - (d[i] + d[i + 1] + d[i + 2]) / 765;
            n++;
          }
          var dolya = n ? sum / n : 0;
          var kat = dolya > 0.6 ? 2 : dolya > 0.2 ? 1 : 0;
          var spisok = C.zapolnenie || [];
          gotovo({
            procent: Math.round(dolya * 100),
            nazvanie: spisok[kat] ? spisok[kat].nazvanie.split(':')[0] : '',
            koef: spisok[kat] ? spisok[kat].koef : 1
          });
        } catch (e) { gotovo(null); }
        URL.revokeObjectURL(url);
      };
      img.onerror = function () { gotovo(null); URL.revokeObjectURL(url); };
      img.src = url;
    }

    /* Подпись под полем файла меняется на имя выбранного макета.
       Без этого человек не уверен, что файл вообще прикрепился, — а он
       и так на последнем шаге, где терять его нельзя. */
    /* Сколько файлов берём. Столько же стоит на сервере (MAX_MAKETOV
       в app.py) — предел должен быть один, иначе браузер разрешит
       выбрать пять, а доедут четыре, и никто не поймёт почему. */
    var MAX_MAKETOV = 4;

    (function () {
      var pole = document.getElementById('sekMaket');
      var podpis = document.getElementById('sekFajlPodpis');
      if (!pole || !podpis) return;
      var PUSTO = 'Можно выбрать несколько файлов — лицо и оборот. ' +
                  'Целую папку — архивом ZIP. До 20 МБ каждый файл. Необязательно.';

      pole.addEventListener('change', function () {
        var fajly = pole.files ? Array.prototype.slice.call(pole.files, 0, MAX_MAKETOV) : [];
        if (!fajly.length) {
          podpis.textContent = PUSTO;
          podpis.className = '';
          return;
        }
        var vsego = 0;
        fajly.forEach(function (f) { vsego += f.size; });
        var mb = vsego / 1024 / 1024;
        var razmer = mb < 1 ? Math.round(vsego / 1024) + ' КБ' : mb.toFixed(1) + ' МБ';
        var opisanie = (fajly.length === 1 ? 'Приложен: ' : 'Приложено ' + fajly.length + ': ') +
          fajly.map(function (f) { return f.name; }).join(', ') + ' · ' + razmer;
        podpis.textContent = opisanie;
        podpis.className = 'est';

        /* Считаем краску сразу, как только файлы выбраны. Результат
           показываем человеку — он должен видеть, на чём основана цена.

           Стороны усредняем, а не берём худшую: чернила тратятся на
           каждую сторону отдельно, а цена в прайсе — за обе сразу.
           Белый оборот при плотном лице действительно дешевле, и
           считать весь заказ по лицу было бы завышением. */
        zamerMaketa = null;
        var zamery = [], zhdem = fajly.length;
        fajly.forEach(function (f) {
          zamerZalivki(f, function (z) {
            if (z) zamery.push(z);
            if (--zhdem) return;

            if (!zamery.length) {
              podpis.textContent = opisanie + ' · заливку посмотрим глазами: ' +
                'этот формат браузер не читает';
              return;
            }
            var sum = 0;
            zamery.forEach(function (z) { sum += z.procent; });
            var srednee = Math.round(sum / zamery.length);
            var spisok = C.zapolnenie || [];
            var kat = srednee > 60 ? 2 : srednee > 20 ? 1 : 0;
            zamerMaketa = {
              procent: srednee,
              nazvanie: spisok[kat] ? spisok[kat].nazvanie.split(':')[0] : '',
              koef: spisok[kat] ? spisok[kat].koef : 1,
              storon: zamery.length
            };
            podpis.textContent = opisanie + ' · краски на макете ' + srednee + '% — ' +
              zamerMaketa.nazvanie.toLowerCase() + ' заполнение' +
              (zamery.length > 1 ? ' (среднее по ' + zamery.length + ' сторонам)' : '');
          });
        });
      });
    })();

    forma.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var tel = document.getElementById('sekTel').value.trim();
      var soglasie = document.getElementById('sekSoglasie');
      var knopka = document.getElementById('sekOtpravit');
      if (!tel) return;
      // Галочка стоит required — браузер не даст отправить форму без неё.
      // Проверяем ещё и здесь: заявка уходит по fetch, и полагаться на одну
      // только браузерную проверку в деле о персональных данных нельзя.
      if (!soglasie.checked) {
        msgEl.style.color = '#8B1A1A';
        msgEl.textContent = 'Отметьте согласие на обработку персональных данных — без него мы не вправе принять заявку.';
        return;
      }
      // Макет, если человек его приложил. Файл берём ДО блокировки кнопки:
      // после disabled браузер поле не трогает, но порядок важен для чтения.
      var poleFajl = document.getElementById('sekMaket');
      var fajly = poleFajl && poleFajl.files
        ? Array.prototype.slice.call(poleFajl.files, 0, MAX_MAKETOV) : [];

      var tyazhelyj = fajly.filter(function (f) { return f.size > 20 * 1024 * 1024; });
      if (tyazhelyj.length) {
        msgEl.style.color = '#8B1A1A';
        msgEl.textContent = 'Файл ' + tyazhelyj[0].name + ' больше 20 МБ. ' +
                            'Отправьте заявку без него — мы напишем, куда прислать макет.';
        return;
      }

      knopka.disabled = true; knopka.style.opacity = '.6';
      msgEl.style.color = '#4A0E17';
      msgEl.textContent = fajly.length
        ? (fajly.length === 1 ? 'Отправляем заявку и макет...'
                              : 'Отправляем заявку и макеты...')
        : 'Отправляем...';

      var polya = {
        contact: tel,
        // Факт согласия уезжает вместе с заявкой и ложится в журнал:
        // по 152-ФЗ мы должны уметь показать, что человек его давал.
        path: put.concat(stroCkiOplaty()).concat(
          [fajly.length
            ? (fajly.length === 1 ? 'Макет приложен к заявке: ' : 'Макетов приложено ' +
               fajly.length + ': ') + fajly.map(function (f) { return f.name; }).join(', ')
            : 'Макет к заявке не приложен']
            .concat(zamerMaketa
              ? ['Замер по файлу: краски ' + zamerMaketa.procent + '%, ' +
                 zamerMaketa.nazvanie.toLowerCase() + ' заполнение (коэффициент ' +
                 zamerMaketa.koef + ')' +
                 (zamerMaketa.storon > 1 ? ' — среднее по ' + zamerMaketa.storon + ' сторонам' : '')]
              : [])
            .concat(['Согласие на обработку персональных данных получено'])
        ),
        total: itog && itog.summa ? Math.round(itog.summa) : 0,
        scenario: 'Секретарь на сайте'
      };

      // С файлом отправляем формой, без файла — как раньше, JSON.
      // Сервер понимает оба вида: у него стоит
      // `request.get_json(silent=True) or request.form`.
      var zapros;
      if (fajly.length) {
        var fd = new FormData();
        fd.append('contact', polya.contact);
        fd.append('path', JSON.stringify(polya.path));
        fd.append('total', String(polya.total));
        fd.append('scenario', polya.scenario);
        // Все файлы под одним именем поля: сервер читает их getlist('maket')
        // и сохраняет по порядку, в котором клиент их выбрал.
        fajly.forEach(function (f) { fd.append('maket', f, f.name); });
        zapros = fetch('/api/bot-lead', { method: 'POST', body: fd });
      } else {
        zapros = fetch('/api/bot-lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(polya)
        });
      }

      zapros
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.ok) {
            zakonchitZayavku(j.lead);
          } else {
            zapasnojPut(tel);
          }
        })
        .catch(function () { zapasnojPut(tel); });
    });

    /** Строки про деньги для заявки.
     *
     *  Владелица 17.08.2026: в заявке не видно предоплату. Показывали
     *  её только в диалоге, а на почту уходила голая сумма — и было
     *  непонятно, сколько человек должен внести и по чему звонить.
     *
     *  Процент берётся из прайса, а не вписан числом: поменяется
     *  в data/prices.ts — поменяется и здесь. */
    function stroCkiOplaty() {
      var o = C.oplata || {};
      if (!itog || itog.summa == null || !o.procent) return [];

      var procent = procentPredoplaty();
      var bolshoj = bolshojTirazh();

      var stroki = [
        'Итого по расчёту: ' + rub(itog.summa),
        'Предоплата ' + procent + '%: ' + rub(Math.round(itog.summa * procent / 100)),
        'Оплата на момент заявки: не внесена'
      ];
      if (bolshoj) {
        stroki.splice(2, 0, 'Тираж от ' + o.bolshojOt + ' штук — предоплата половина: ' +
          'бумагу и чернила на такой объём закупаем до печати');
      }
      return stroki;
    }

    /* Конец разговора. Требование владелицы: «на сайте мы должны
       закончить заявку» — человек не должен уходить со страницы,
       не понимая, что дальше. Поэтому здесь номер заявки, что будет
       происходить, и как внести предоплату. */
    function zakonchitZayavku(nomerZayavki) {
      forma.hidden = true;
      knopki.innerHTML = '';
      msgEl.textContent = '';

      var o = C.oplata || {};
      var itogo = itog && itog.summa ? itog.summa : null;
      var proc = procentPredoplaty();
      var predoplata = itogo ? Math.round(itogo * proc / 100) : null;

      var text = '<b>Заявка' + (nomerZayavki ? ' №' + nomerZayavki : '') + ' принята.</b><br>' +
                 'Перезвоним в рабочие часы: Пн–Сб 09:00–20:00, Вс 10:00–19:00. ' +
                 'Подтвердим срок и проверим макет до печати.';
      skazat('bot', text);

      if (predoplata) {
        var oplataText = 'Предоплата ' + proc + '% — ' +
          '<span class="sek-cifra">' + rub(predoplata) + '</span>' +
          (bolshojTirazh()
            ? 'Тираж от ' + o.bolshojOt + ' штук — половина вперёд: бумагу ' +
              'и чернила на такой объём закупаем до печати.<br>'
            : '') +
          'Печать запускаем после поступления.<br>' +
          'Перевод по номеру <b>' + (o.nomer || '') + '</b>' +
          ' или наличными в студии: г. Лермонтов, ул. Нагорная 2/1, этаж 2.';

        // QR и кнопка появляются, только если в прайсе задана ссылка
        // на оплату. Нет ссылки — остаётся перевод по номеру, и это
        // тоже рабочий путь: эквайринг мы сознательно не подключали.
        if (o.ssylka) {
          oplataText += '<br><a class="btn-gold sek-oplatit" href="' + o.ssylka +
            '" target="_blank" rel="noopener">Оплатить ' + rub(predoplata) + '</a>';
          if (o.qr) {
            oplataText += '<div class="sek-qr">' + o.qr +
              '<span>наведите камеру телефона</span></div>';
          }
        }
        skazat('bot', oplataText);
      }

      podpisEl.textContent = 'заявка отправлена';
      zanovoB.textContent = 'Посчитать ещё один заказ';
    }

    /* Заявка не ушла — клиента не теряем: даём написать самому,
       текст уже собран. Тот же приём, что у формы заявки на сайте. */
    function zapasnojPut(tel) {
      var text = 'Здравствуйте! Заявка с сайта granat-kmv.ru\n' +
        put.join(' → ') +
        (itog && itog.summa ? '\nПримерно: ' + rub(itog.summa) : '') +
        '\nТелефон: ' + tel;
      msgEl.style.color = '#8B1A1A';
      msgEl.innerHTML = 'Связь со студией не отвечает. Напишите нам сами — текст уже готов: ' +
        '<a class="gold-grad" target="_blank" rel="noopener" href="https://vk.me/club238836731">ВКонтакте</a> · ' +
        '<a class="gold-grad" target="_blank" rel="noopener" href="https://wa.me/79992449999?text=' +
        encodeURIComponent(text) + '">WhatsApp</a> · ' +
        '<a class="gold-grad" href="tel:+79992449999">позвонить</a>';
    }

    zanovoB.addEventListener('click', start);
    start();
  })();
  </script>
