  <script>
  (function(){
    var feed=document.getElementById('simFeed'),kb=document.getElementById('simKb');
    if(!feed||!kb)return;
    var elTotal=document.getElementById('simTotal'),elItems=document.getElementById('simItems');

    var SC={
      cafe:{
        base:15000, baseName:'Приём заказов в чат',
        intro:'Привет! Я бот-помощник для ресторанов. Базовая сборка — приём заказов и отправка их вам в чат — от <b>15 000 ₽</b>. Какую функцию добавим в автопилот?',
        rounds:[
          {opts:[
            {l:'+ Интерактивное меню (+10 000 ₽)', n:'Интерактивное меню', p:10000, r:'Отличный выбор! Красивое меню поднимает средний чек примерно на четверть.'},
            {l:'+ Оплата картами (+20 000 ₽)', n:'Оплата картами', p:20000, r:'Верно мыслите. Оплата прямо в Telegram убирает шаг, на котором клиенты чаще всего отваливаются.'}
          ], q:'Сейчас ваш бот стоит <b>{total}</b>. Добавим систему лояльности и кешбэк для клиентов?'},
          {opts:[
            {l:'+ Кешбэк (+15 000 ₽)', n:'Кешбэк и лояльность', p:15000, r:'Хорошо. Кешбэк возвращает гостя заметно чаще, чем разовая скидка.'},
            {l:'Оставить так и обсудить', p:0, r:'Принято, ничего лишнего.'}
          ]}
        ],
        term:'7–18 дней'
      },
      beauty:{
        base:15000, baseName:'Модуль онлайн-записи',
        intro:'Здравствуйте! Автоматическая запись экономит мастеру до 12 часов в неделю. Стартовая цена модуля записи — <b>15 000 ₽</b>. Что ещё должен делать ваш бот?',
        rounds:[
          {opts:[
            {l:'+ Напоминания за 2 часа (+8 000 ₽)', n:'Напоминания клиентам', p:8000, r:'Супер! Напоминания сильно сокращают неявки — люди просто забывают, а не отказываются.'},
            {l:'+ Google-календарь (+12 000 ₽)', n:'Интеграция с календарём', p:12000, r:'Удобно: записи сразу видны в вашем календаре, без переноса руками.'}
          ], q:'Текущая стоимость — <b>{total}</b>. Нужна синхронизация с календарём или CRM?'},
          {opts:[
            {l:'+ Интеграция с CRM (+15 000 ₽)', n:'Интеграция с CRM', p:15000, r:'Тогда история клиента будет собираться сама.'},
            {l:'Перейти к оформлению', p:0, r:'Хорошо, оформляем как есть.'}
          ]}
        ],
        term:'7–15 дней'
      }
    };

    var mode='cafe', total=0, items=[], round=0, busy=false;

    function money(n){return n.toLocaleString('ru-RU')+' ₽'}
    function paint(){
      elTotal.textContent=money(total);
      elItems.textContent=items.length?SC[mode].baseName+' + '+items.join(' + '):SC[mode].baseName;
    }
    function row(side,html,cls){
      var r=document.createElement('div');r.className='sim-row '+side;
      r.innerHTML='<div class="'+(cls||'sim-b')+'">'+html+'</div>';
      feed.appendChild(r);feed.scrollTop=feed.scrollHeight;return r;
    }
    function dots(){
      var r=document.createElement('div');r.className='sim-row bot';
      r.innerHTML='<div class="sim-dots"><i></i><i></i><i></i></div>';
      feed.appendChild(r);feed.scrollTop=feed.scrollHeight;return r;
    }
    function think(fn){
      busy=true;kb.innerHTML='';
      var d=dots();
      setTimeout(function(){
        d.parentNode&&d.parentNode.removeChild(d);
        fn();busy=false;
      },800+Math.random()*400);
    }
    function buttons(list){
      kb.innerHTML='';
      list.forEach(function(o){
        var b=document.createElement('button');
        b.type='button';b.className='sim-btn'+(o.ghost?' ghost':'');b.textContent=o.l;
        b.onclick=o.go;kb.appendChild(b);
      });
    }
    function askRound(){
      var sc=SC[mode],rd=sc.rounds[round];
      buttons(rd.opts.map(function(o){
        return {l:o.l,go:function(){pick(o)}};
      }));
    }
    function pick(o){
      if(busy)return;
      row('me',o.l);
      if(o.p){total+=o.p;if(o.n)items.push(o.n);paint()}
      var sc=SC[mode],rd=sc.rounds[round];
      round++;
      think(function(){
        var txt=o.r||'';
        if(round<sc.rounds.length&&rd.q){txt+=' '+rd.q.replace('{total}',money(total))}
        row('bot',txt);
        if(round<sc.rounds.length){askRound()}else{finish()}
      });
    }
    function finish(){
      var sc=SC[mode];
      think(function(){
        var rows='<div class="r"><span>'+sc.baseName+'</span><span>'+money(sc.base)+'</span></div>';
        for(var k=0;k<items.length;k++){
          rows+='<div class="r"><span>'+items[k]+'</span><span>+ '+money(itemPrice(items[k]))+'</span></div>';
        }
        rows+='<div class="r sum"><span>Итого</span><span>'+money(total)+'</span></div>';
        rows+='<div class="r" style="margin-top:8px;opacity:.7"><span>Срок разработки</span><span>'+sc.term+'</span></div>';
        row('bot','📈 <b>Ваша конфигурация готова</b>');
        row('bot',rows,'sim-check');
        // Окупаемость не называем цифрой: симулятор не спрашивает про поток
        // заявок, а без него любой срок — догадка. Калькулятор выше эти
        // данные собирает ползунками, там расчёт честный.
        row('bot','Сколько это окупается — посчитайте на своих цифрах: '+
            '<a href="/cifra#vygoda" style="color:#4A0E17;font-weight:600">'+
            'калькулятор чуть выше</a> на этой странице.<br><br>'+
            'А чтобы Гульнара подтвердила точную сумму и срок, оставьте Telegram или телефон:');
        formStep();
      });
    }
    function itemPrice(name){
      var sc=SC[mode],p=0;
      sc.rounds.forEach(function(rd){rd.opts.forEach(function(o){if(o.n===name)p=o.p})});
      return p;
    }
    function formStep(){
      kb.innerHTML='';
      var w=document.createElement('div');w.className='sim-form';
      w.innerHTML='<input class="sim-in" id="simIn" type="text" placeholder="@username или +7 999 000-00-00"><button class="sim-go" type="button" id="simGo">Отправить</button>';
      kb.appendChild(w);
      var e=document.createElement('div');e.className='sim-err';e.id='simErr';e.style.display='none';kb.appendChild(e);
      document.getElementById('simGo').onclick=send;
      document.getElementById('simIn').onkeydown=function(ev){if(ev.key==='Enter')send()};
    }
    function send(){
      var i=document.getElementById('simIn'),er=document.getElementById('simErr'),v=(i.value||'').trim();
      if(v.length<4){er.textContent='Нужен Telegram или телефон — иначе мы не сможем ответить.';er.style.display='';i.focus();return}
      er.style.display='none';
      row('me',v.replace(/[<>&]/g,''));
      kb.innerHTML='';
      var body={contact:v,widget:'bot-simulator',path:[SC[mode].baseName].concat(items),total:total,scenario:mode};
      fetch('/api/bot-lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
        .then(function(r){return r.json()}).catch(function(){return{ok:false}})
        .then(function(res){
          think(function(){
            var n=res&&res.lead?' №'+res.lead:'';
            if(res&&res.pushed){
              row('bot','Готово, заявка'+n+' принята ✅ Джарвис уже написал вам в Telegram — продолжим там.');
            }else{
              row('bot','Готово, заявка'+n+' принята ✅ Ваша конфигурация сохранена.');
            }
            // Уводим в бота, пока клиент здесь: номер заявки в ссылке, поэтому
            // Джарвис сразу видит собранный чек и не спрашивает всё заново.
            if(res&&res.tg&&!res.pushed){
              row('bot','Нажмите — Джарвис уточнит детали и посчитает точную сумму:');
              var a=document.createElement('a');
              a.className='sim-btn';a.style.display='block';a.style.textDecoration='none';
              a.href=res.tg;a.target='_blank';a.rel='noopener';
              a.textContent='Продолжить в Telegram →';
              kb.appendChild(a);
            }
            var again=document.createElement('button');
            again.type='button';again.className='sim-btn ghost';
            again.textContent='Собрать заново';
            again.onclick=function(){start(mode)};
            kb.appendChild(again);
          });
        });
    }
    function start(m){
      mode=m;total=SC[m].base;items=[];round=0;
      feed.innerHTML='';paint();
      think(function(){row('bot',SC[m].intro);askRound()});
    }

    var modes=[].slice.call(document.querySelectorAll('.sim-mode'));
    modes.forEach(function(b){
      b.addEventListener('click',function(){
        if(busy)return;
        modes.forEach(function(x){x.classList.remove('is-on')});
        b.classList.add('is-on');
        start(b.getAttribute('data-mode'));
      });
    });

    var booted=false;
    function boot(){if(booted)return;booted=true;start('cafe')}
    if('IntersectionObserver' in window){
      var io2=new IntersectionObserver(function(es){
        es.forEach(function(en){if(en.isIntersecting){boot();io2.disconnect()}});
      },{threshold:.2});
      io2.observe(document.getElementById('simulator'));
    }else{boot()}
  })();
  </script>
