  <script>

    // Order form
    const form = document.getElementById('orderForm');
    const msg = document.getElementById('formMsg');

    // Запасной путь: если заявка не ушла с сервера, клиента не теряем —
    // даём открыть мессенджер с уже подставленным текстом заявки.
    function rescueButtons(data) {
      const text =
        'Здравствуйте! Заявка с сайта granat-kmv.ru\n' +
        'Имя: ' + (data.name || '') + '\n' +
        'Контакт: ' + (data.phone || '') +
        (data.service ? '\nЧто нужно: ' + data.service : '') +
        (data.notes ? '\nПожелания: ' + data.notes : '');
      const enc = encodeURIComponent(text);
      const style = 'display:inline-block; margin:8px 6px; padding:12px 22px;';
      // Первым — бот: он сам задаёт вопросы и приносит готовый бриф.
      // Дальше — то, что работает без Telegram. 09.08.2026 он перестал
      // открываться, и запасных выходов оказалось на один меньше, чем
      // нужно: ВКонтакте здесь не было вовсе.
      return '<span style="display:block; margin-top:10px;">' +
        '<a class="btn-gold" style="' + style + '" target="_blank" rel="noopener" ' +
        'href="https://t.me/GranatJarvis_bot">Продолжить в Telegram-боте</a>' +
        '<a class="btn-gold" style="' + style + '; opacity:.85;" target="_blank" rel="noopener" ' +
        'href="https://wa.me/79992449999?text=' + enc + '">Написать в WhatsApp</a>' +
        '<a class="btn-gold" style="' + style + '; opacity:.85;" target="_blank" rel="noopener" ' +
        'href="https://vk.me/club238836731">Написать во ВКонтакте</a></span>' +
        '<span style="display:block; margin-top:6px; font-size:12px; opacity:.7;">' +
        'В боте быстрее: задаст пару вопросов по вашей задаче и сразу передаст расчёт.</span>';
    }

    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      // Блокируем кнопку на время отправки, иначе двойное нажатие
      // создаёт две одинаковые заявки.
      if (submitBtn.disabled) return;
      submitBtn.disabled = true;
      submitBtn.style.opacity = '.6';
      msg.style.color = '#F9F3EB';
      msg.textContent = 'Отправляем...';
      const data = Object.fromEntries(new FormData(form).entries());
      try {
        const res = await fetch('/api/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const json = await res.json();
        if (res.ok && json.ok) {
          form.reset();
          msg.style.color = '#D4AF37';
          // Заявка ушла — но пока это только имя и телефон. Точное ТЗ
          // соберёт Джарвис, поэтому уводим клиента в переписку сразу, пока
          // он ещё здесь и настроен разговаривать. Куда именно вести —
          // решает сервер по каналу, который клиент отметил в форме. Раньше
          // здесь всех звали в Telegram: выбравшие ВКонтакте попадали в
          // чужой мессенджер, а когда Telegram перестал открываться —
          // упирались в стену.
          const next = json.next;
          if (next) {
            msg.innerHTML = '✅ Заявка №' + json.lead + ' принята.' +
              '<span style="display:block; margin-top:10px; font-weight:600;">' +
              'Осталось уточнить детали — это пара минут:</span>' +
              '<span style="display:block; margin-top:10px;">' +
              '<a class="btn-gold" style="display:inline-block; padding:13px 24px;" ' +
              'target="_blank" rel="noopener" href="' + next.url + '">' +
              next.label + '</a></span>' +
              '<span style="display:block; margin-top:8px; font-size:12px; opacity:.7;">' +
              next.note + '</span>';
          } else {
            msg.textContent = '✅ Спасибо! Заявка отправлена — мы свяжемся с вами.';
          }
          metrikaGoal('zayavka');
          // lead_form — имя цели из ТЗ по Метрике. Историческую
          // «zayavka» не убираем: по ней собрана статистика за месяцы.
          if (window.granatGoal) window.granatGoal('lead_form', { form: 'site_order' });
        } else if (json.error === 'Укажите имя') {
          msg.style.color = '#ffb4b4';
          msg.textContent = '❌ Укажите имя';
        } else {
          msg.style.color = '#F9F3EB';
          msg.innerHTML = 'Мы получили вашу заявку, но чтобы ответить быстрее — ' +
            'отправьте её одним нажатием, всё уже заполнено:' + rescueButtons(data);
          metrikaGoal('zayavka_rezerv');
        }
      } catch (e) {
        msg.style.color = '#F9F3EB';
        msg.innerHTML = 'Не получилось отправить с сайта. Отправьте заявку ' +
          'одним нажатием — данные уже подставлены:' + rescueButtons(data);
        metrikaGoal('zayavka_rezerv');
      } finally {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '';
      }
    });
  </script>
